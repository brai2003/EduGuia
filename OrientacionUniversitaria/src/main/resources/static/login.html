<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión / Registro - EduGuía Argentina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="fa-solid fa-graduation-cap me-2"></i>EduGuía Argentina
            </a>
            <a href="index.html" class="btn btn-outline-light btn-sm rounded-pill"><i class="fa-solid fa-arrow-left me-1"></i>Volver al Inicio</a>
        </div>
    </nav>

    <!-- CONTENIDO LOGIN / REGISTRO -->
    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h4 class="fw-bold mb-0" id="form-title"><i class="fa-solid fa-user-circle me-2"></i>Iniciar Sesión</h4>
                    </div>
                    <div class="card-body p-4">
                        <div id="alert-box"></div>

                        <!-- FORMULARIO LOGIN -->
                        <form id="form-login" onsubmit="handleLogin(event)">
                            <div class="mb-3">
                                <label class="form-label font-weight-bold">Correo Electrónico</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                                    <input type="email" id="login-email" class="form-control" placeholder="estudiante@ejemplo.com" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label font-weight-bold">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                                    <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow-sm mb-3">Ingresar</button>
                            <p class="text-center text-muted small mb-0">¿No tenés cuenta? <a href="#" onclick="toggleForm('register')" class="text-primary fw-bold">Registrate aquí</a></p>
                        </form>

                        <!-- FORMULARIO REGISTRO -->
                        <form id="form-register" style="display: none;" onsubmit="handleRegister(event)">
                            <div class="row g-2 mb-2">
                                <div class="col-6">
                                    <label class="form-label small fw-bold">Nombre</label>
                                    <input type="text" id="reg-nombre" class="form-control form-control-sm" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label small fw-bold">Apellido</label>
                                    <input type="text" id="reg-apellido" class="form-control form-control-sm" required>
                                </div>
                            </div>
                            <div class="mb-2">
                                <label class="form-label small fw-bold">DNI</label>
                                <input type="number" id="reg-dni" class="form-control form-control-sm" required>
                            </div>
                            <div class="mb-2">
                                <label class="form-label small fw-bold">Correo Electrónico</label>
                                <input type="email" id="reg-email" class="form-control form-control-sm" required>
                            </div>
                            <div class="mb-2">
                                <label class="form-label small fw-bold">Contraseña</label>
                                <input type="password" id="reg-password" class="form-control form-control-sm" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Área de Interés Principal</label>
                                <select id="reg-interes" class="form-select form-select-sm">
                                    <option value="Tecnología e Informática">Tecnología e Informática</option>
                                    <option value="Ingeniería y Producción">Ingeniería y Producción</option>
                                    <option value="Ciencias Naturales">Ciencias Naturales</option>
                                    <option value="Humanidades y Ciencias Sociales">Humanidades y Ciencias Sociales</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success w-100 fw-bold py-2 shadow-sm mb-3">Crear Cuenta</button>
                            <p class="text-center text-muted small mb-0">¿Ya tenés cuenta? <a href="#" onclick="toggleForm('login')" class="text-primary fw-bold">Iniciá sesión</a></p>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-dark text-white py-3 mt-auto text-center">
        <small>&copy; 2026 EduGuía Argentina. Todos los derechos reservados.</small>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
